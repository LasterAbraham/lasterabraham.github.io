        <p>于2007年农历十月廿九（新历12月8日）出生于广西壮自治区桂林市的县城，在备战高考前夕因懦弱在毕业前退学，所以只有初中学历。</p>
        <p>2018年因接触游戏《Undertale》而接触到绘画与写作，2023年正式开始文学创作，为确保每日能够不受打扰写作，效仿儿童文学作家郑渊洁的作息，确保每日两千字的创作</p>
        <p>职业有：画师、作家、赛博考古、业余翻译。喜欢吃咸辣酸的食物，甜品唯爱巧克力</p>
        <p>脑绘最美奖画手+写手，绝望又易怒的文盲，半途而飞飞行员，心胸狭窄，💖🌹爱听漂亮话🌸🌸</p>
